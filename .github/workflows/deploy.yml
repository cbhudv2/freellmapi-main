name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: llmapi-production
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/llmapi

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tag: sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: LLMAPI_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=llmapi-amd64
          cache-to: type=gha,scope=llmapi-amd64,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment: production
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      VPS_KNOWN_HOSTS: ${{ vars.VPS_KNOWN_HOSTS }}
      SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
      PROVIDER_KEYS_JSON: ${{ secrets.PROVIDER_KEYS_JSON }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      DB_BACKUP_KEY: ${{ secrets.DB_BACKUP_KEY }}
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - name: Prepare deployment files
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${VPS_HOST:?missing production variable VPS_HOST}"
          : "${VPS_USER:?missing production variable VPS_USER}"
          : "${VPS_KNOWN_HOSTS:?missing production variable VPS_KNOWN_HOSTS}"
          : "${SSH_PRIVATE_KEY:?missing production secret VPS_SSH_PRIVATE_KEY}"
          : "${PROVIDER_KEYS_JSON:?missing production secret PROVIDER_KEYS_JSON}"
          : "${ENCRYPTION_KEY:?missing production secret ENCRYPTION_KEY}"
          : "${DB_BACKUP_KEY:?missing production secret DB_BACKUP_KEY}"
          umask 077
          install -d -m 700 "$HOME/.ssh" .deploy-secrets
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          printf 'GHCR_IMAGE=%s\nIMAGE_TAG=sha-%s\n' "$IMAGE" "$GITHUB_SHA" > .env.next
          printf 'ENCRYPTION_KEY=%s\nFREEAPI_DB_BACKUP_KEY=%s\n' "$ENCRYPTION_KEY" "$DB_BACKUP_KEY" > .deploy-secrets/runtime.env.next
          printf '%s' "$PROVIDER_KEYS_JSON" > .deploy-secrets/providers.json.next
      - name: Upload and deploy
        shell: bash
        run: |
          set -Eeuo pipefail
          control_path="$RUNNER_TEMP/llmapi-ssh-%C"
          ssh_opts=(
            -i "$HOME/.ssh/id_ed25519"
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o ControlMaster=auto
            -o ControlPersist=120
            -o ControlPath="$control_path"
          )
          connected=0
          for attempt in 1 2 3; do
            if ssh "${ssh_opts[@]}" -MNf "$VPS_USER@$VPS_HOST"; then
              connected=1
              break
            fi
            sleep $((attempt * 10))
          done
          if [[ "$connected" -ne 1 ]]; then
            echo "Could not establish the deployment SSH connection after 3 attempts" >&2
            exit 1
          fi
          trap 'ssh "${ssh_opts[@]}" -O exit "$VPS_USER@$VPS_HOST" >/dev/null 2>&1 || true' EXIT
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'mkdir -p /srv/apps/llmapi/deploy /srv/apps/llmapi/secrets /srv/apps/llmapi/backups'
          scp "${ssh_opts[@]}" docker-compose.yml "$VPS_USER@$VPS_HOST:/srv/apps/llmapi/docker-compose.yml"
          scp "${ssh_opts[@]}" deploy/remote-deploy.sh "$VPS_USER@$VPS_HOST:/srv/apps/llmapi/deploy/remote-deploy.sh"
          scp "${ssh_opts[@]}" .env.next "$VPS_USER@$VPS_HOST:/srv/apps/llmapi/.env.next"
          scp "${ssh_opts[@]}" .deploy-secrets/runtime.env.next "$VPS_USER@$VPS_HOST:/srv/apps/llmapi/secrets/runtime.env.next"
          scp "${ssh_opts[@]}" .deploy-secrets/providers.json.next "$VPS_USER@$VPS_HOST:/srv/apps/llmapi/secrets/providers.json.next"
          printf '%s' "$GHCR_TOKEN" | ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" "export XDG_RUNTIME_DIR=/run/user/\$(id -u); export DOCKER_HOST=unix:///run/user/\$(id -u)/docker.sock; docker login ghcr.io -u '$GITHUB_ACTOR' --password-stdin"
          ssh "${ssh_opts[@]}" "$VPS_USER@$VPS_HOST" 'chmod 700 /srv/apps/llmapi/deploy/remote-deploy.sh && /srv/apps/llmapi/deploy/remote-deploy.sh image'
